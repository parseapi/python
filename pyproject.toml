[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parseapi"
version = "0.3.0"
description = "Official parseAPI client for Python. One key, minimal JSON, fast."
readme = "README.md"
license = "MIT"
authors = [{ name = "parseAPI", email = "hello@parseapi.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]
keywords = [
	"parseapi",
	"ip",
	"geolocation",
	"email validation",
	"phone validation",
	"postal",
	"timezone",
	"currency",
	"weather",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://parseapi.com"
Documentation = "https://parseapi.com/docs"
Repository = "https://github.com/parseapi/python"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/parseapi"]
